name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================================
  # 1. Backend Testing & Code Quality
  # ============================================================
  backend-ci:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow_password
          POSTGRES_DB: workflow_pro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test_secret_key_ci_workflow_pro_enterprise_2026
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          ENVIRONMENT: test
          LOG_LEVEL: WARNING
        run: |
          pytest -v

  # ============================================================
  # 2. Frontend Testing & Production Build
  # ============================================================
  frontend-ci:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Vitest Suite
        run: npm test -- --run

      - name: Build Production Frontend Bundle
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

  # ============================================================
  # 3. Docker Image Build Validation
  # ============================================================
  docker-validation:
    name: Docker Images Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: workflow-pro-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: workflow-pro-frontend:test
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000/api/v1
